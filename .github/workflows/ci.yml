name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint / typecheck / unit / e2e / package (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Committed plugin bundle is fresh
        run: pnpm check:bundle
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:package

  runtime-node20:
    name: bundled CLI on the minimum runtime (Node 20.19, no install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          # This job installs nothing; v5 would otherwise auto-cache via package.json "packageManager" and need pnpm.
          package-manager-cache: false
      - name: Demo exits 1 (intentional mismatch) and healthy exits 0
        shell: bash
        run: |
          set +e
          node plugins/claude/db-preflight/dist/db-preflight.cjs demo --format json > /dev/null; test $? -eq 1 || exit 1
          node plugins/claude/db-preflight/dist/db-preflight.cjs demo --scenario healthy > /dev/null; test $? -eq 0 || exit 1
          node plugins/claude/db-preflight/dist/db-preflight.cjs scan --schema fixtures/unsupported/schema.prisma --snapshot fixtures/unsupported/snapshot.json --default-schema public > /dev/null; test $? -eq 3 || exit 1

  prisma-fixtures:
    name: fixtures vs pinned prisma@7.10.0 (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:prisma

  integration:
    name: PostgreSQL 16 + 18 integration (disposable containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration
        env:
          DBP_PG_IMAGES: postgres:16.15-alpine,postgres:18.6-alpine
